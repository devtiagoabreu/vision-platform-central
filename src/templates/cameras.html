{% extends "base_central.html" %}
{% block title %}Câmeras{% endblock %}
{% block content %}
<div class="max-w-6xl">
    <h2 class="text-2xl font-bold mb-6">Câmeras</h2>

    <div class="bg-gray-800 rounded-lg overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-gray-700">
                <tr>
                    <th class="px-4 py-2 text-left text-gray-300">Camera ID</th>
                    <th class="px-4 py-2 text-left text-gray-300">Local</th>
                    <th class="px-4 py-2 text-left text-gray-300">Observações</th>
                </tr>
            </thead>
            <tbody>
                {% for cam in cameras %}
                <tr class="border-t border-gray-700">
                    <td class="px-4 py-2 text-white font-mono">{{ cam.camera_id }}</td>
                    <td class="px-4 py-2 text-gray-300">{{ cam.local_id }}</td>
                    <td class="px-4 py-2 text-gray-300">{{ cam.observation_count }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3" class="px-4 py-8 text-center text-gray-500">Nenhuma câmera encontrada</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
