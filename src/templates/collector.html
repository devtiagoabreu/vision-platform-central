{% extends "base_central.html" %}
{% block title %}Collector{% endblock %}
{% block content %}
<div class="max-w-4xl">
    <h2 class="text-2xl font-bold mb-6">Collector</h2>

    <div class="bg-gray-800 p-6 rounded-lg mb-6">
        <h3 class="font-semibold mb-4">Status</h3>
        <div class="grid grid-cols-2 gap-4 text-sm">
            <div>
                <span class="text-gray-400">Intervalo de Polling:</span>
                <p class="text-white">{{ collector_interval_ms }}ms</p>
            </div>
            <div>
                <span class="text-gray-400">Estado:</span>
                <p class="text-green-400">Rodando</p>
            </div>
        </div>
    </div>

    <div class="bg-gray-800 p-6 rounded-lg">
        <h3 class="font-semibold mb-4">Ações</h3>
        <form method="POST" action="/dashboard/collector/poll">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm">
                Poll Manual Agora
            </button>
        </form>
        <p class="text-xs text-gray-500 mt-2">Força um ciclo de coleta de todos os locais registrados.</p>
    </div>
</div>
{% endblock %}
