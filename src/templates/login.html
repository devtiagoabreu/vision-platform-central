<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoFissura — Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen">
    <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-white text-center mb-2">GeoFissura</h1>
        <p class="text-gray-400 text-center text-sm mb-6">Vision Platform Central</p>
        {% if error %}
        <div class="bg-red-900/50 border border-red-600 text-red-300 px-4 py-2 rounded mb-4 text-sm">
            {{ error }}
        </div>
        {% endif %}
        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label class="block text-gray-300 text-sm mb-1">Usuário</label>
                <input type="text" name="username" required autofocus
                    class="w-full bg-gray-700 border border-gray-600 text-white rounded px-3 py-2 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-gray-300 text-sm mb-1">Senha</label>
                <input type="password" name="password" required
                    class="w-full bg-gray-700 border border-gray-600 text-white rounded px-3 py-2 focus:outline-none focus:border-blue-500">
            </div>
            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded transition">
                Entrar
            </button>
        </form>
    </div>
</body>
</html>
